[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helios-memory"
version = "0.1.0"
description = "Provider-agnostic cognitive memory plugin for AI agent systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "pyyaml>=6.0",
    "aiosqlite>=0.19",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pyrefly>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["helios_memory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.envs.default.scripts]
typecheck = "pyrefly check --summarize-errors"

[tool.pyrefly]
python-version = "3.11"
project-includes = [
    "helios_memory/**/*.py",
    "tests/**/*.py",
]
